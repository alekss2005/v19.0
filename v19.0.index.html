/* ============ CONFIRM FILTER (тест: ховати «шумні» одиночні) ============ */
/** 1 = показувати всі; 2 = лише 2+ канали; 3 = лише 3+ */
let minConfirm = 1;
function trailConfirmCount(chain) {
  return (chain && chain.channels && chain.channels.size) ? chain.channels.size : 1;
}
function _forceHideMarker(marker, layer) {
  if (!marker) return;
  try { marker.setOpacity(0); } catch (e) {}
  try {
    const el = marker.getElement && marker.getElement();
    if (el) {
      el.style.display = "none";
      el.style.visibility = "hidden";
      el.style.opacity = "0";
      el.style.pointerEvents = "none";
    }
  } catch (e) {}
  try { if (layer) layer.removeLayer(marker); } catch (e) {}
  try { if (map && marker._map) map.removeLayer(marker); } catch (e) {}
}
function _forceShowMarker(marker, layer) {
  if (!marker || !layer) return;
  try {
    if (!marker._map) marker.addTo(layer);
  } catch (e) {
    try { layer.addLayer(marker); } catch (e2) {}
  }
  try { marker.setOpacity(1); } catch (e) {}
  try {
    const el = marker.getElement && marker.getElement();
    if (el) {
      el.style.display = "";
      el.style.visibility = "visible";
      el.style.opacity = "1";
      el.style.pointerEvents = "";
    }
  } catch (e) {}
}
function applyConfirmFilter() {
  if (!msgLayer) return { shown: 0, hidden: 0 };
  let shown = 0, hidden = 0;
  for (const chain of State.trails.values()) {
    if (!chain.marker) continue;
    const n = trailConfirmCount(chain);
    // Пріоритетні канали не ховаємо навіть при ②+/③+
    const show = n >= minConfirm || chainHasPriority(chain);
    chain._filterHide = !show;
    if (show) {
      _forceShowMarker(chain.marker, msgLayer);
      shown++;
    } else {
      _forceHideMarker(chain.marker, msgLayer);
      hidden++;
    }
  }
  if (State.lastActive && State.lastActive.type === "msg") {
    const c = State.trails.get(State.lastActive.key);
    if (c && trailConfirmCount(c) < minConfirm) {
      clearActive();
      updateBottomCard();
    }
  }
  return { shown, hidden };
}
function cycleConfirmFilter() {
  if (minConfirm === 1) minConfirm = 2;
  else if (minConfirm === 2) minConfirm = 3;
  else minConfirm = 1;
  const b = $("btnConfirmFilter");
  if (b) {
    b.classList.remove("on", "strict");
    if (minConfirm === 1) {
      b.textContent = "①+";
      b.title = "Фільтр: усі (1+)";
    } else if (minConfirm === 2) {
      b.textContent = "②+";
      b.classList.add("on");
      b.title = "Фільтр: лише 2+ підтвердження";
    } else {
      b.textContent = "③+";
      b.classList.add("strict");
      b.title = "Фільтр: лише 3+ підтвердження";
    }
  }
  const r = applyConfirmFilter() || { shown: 0, hidden: 0 };
  updateBottomCard();
  const labels = { 1: "Усі цілі", 2: "Лише 2+ канали", 3: "Лише 3+ канали" };
  showToast(`🔎 ${labels[minConfirm]} · видно ${r.shown} · сховано ${r.hidden}`, 3200);
}

/* ============ STRATEGIC AVIATION ============ */
let stratAviaOn = false;
let _lastStratKey = "";
let _lastStratAt = 0;
const STRAT_RE = /(?:стратег\w*\s*авіац|стратегическ\w*\s*авиац|ту-?\s*95|ту-?\s*160|ту-?\s*22|ракетоносец|ракетоносі|бомбардиров|бомбардувальник|взл[её]т\w*\s*(?:с\s+)?(?:энгел|олен|украинк|шагол|дьягил|морок|райвер)|зліт\w*\s*(?:з\s+)?(?:енгел|олен)|airborne\s*alert|в\s+повітрі\s+стратег)/i;
const STRAT_NEG = /(?:немає?\s+зліт|нема\s+активн|без\s+зліт|відбій|отбой|посадк|сели\s+на\s+аеродром)/i;

function checkStrategicAviation(text, ch) {
  if (!stratAviaOn || !text) return;
  if (!STRAT_RE.test(text) || STRAT_NEG.test(text)) return;
  const k = norm(text).slice(0, 90);
  if (k === _lastStratKey && Date.now() - _lastStratAt < 4 * 60 * 1000) return;
  _lastStratKey = k;
  _lastStratAt = Date.now();
  showTopAlert({
    kind: "ballistic",
    icon: "✈️",
    title: "СТРАТЕГІЧНА АВІАЦІЯ",
    place: "Можливий зліт / активність",
    meta: (normalizeChannel(ch) || "") + " · стежте за пусками КР",
    key: "strat|" + k
  });
  playBell();
}

/* ============ 20. NET ============ */
async function fetchMessages() {
  try {
    const r = await fetch(CFG.API_MESSAGES);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    const messages = d.messages || d || [];
    for (const m of messages) {
      const text = m.text || m.message || "";
      const ch = m.channel || "unknown";
      if (!text) continue;
      try { processMessage(text, ch); } catch (e) { console.error(e); }
      try { processImpact(text, ch); } catch (e) {}
      try { checkStrategicAviation(text, ch); } catch (e) {}
    }
    try { applyConfirmFilter(); } catch (e) {}
    // Cleanup старих треків
    const now = Date.now();
    for (const [key, chain] of [...State.trails]) {
      if (now - chain.lastSeen > CFG.STALE_MS) {
        if (chain.marker) msgLayer.removeLayer(chain.marker);
        State.trails.delete(key);
      }
    }
    for (const [key, o] of [...State.msgMarkers]) {
      if (o.isStatic && now - o.lastSeen > CFG.STALE_MS) {
        if (o.marker) msgLayer.removeLayer(o.marker);
        State.msgMarkers.delete(key);
      }
    }
    for (const [key, r] of [...State.impactReports]) {
      if (now - r.lastSeen > 30*60*1000) {
        if (r.marker) impactLayer.removeLayer(r.marker);
        State.impactReports.delete(key);
      }
    }
    updateBottomCard();
    $("statusDot").className = "status-dot";
    $("statusText").textContent = "ONLINE";
  } catch (e) {
    $("statusDot").className = "status-dot err";
    $("statusText").textContent = "ОФЛАЙН";
    console.error("fetch:", e.message);
  }
}
async function fetchThreats() {
  try {
    const r = await fetch(CFG.API_THREATS);
    if (!r.ok) return;
    const d = await r.json();
    syncThreats(d.threats || d || []);
  } catch (e) {}
}
async function fetchAlerts() {
  try {
    const r = await fetch(CFG.API_ALERTS);
    if (!r.ok) return;
    const d = await r.json();
    alertLayer.clearLayers();
    const all = [...(d.raions||[]), ...(d.oblasts||[]), ...(d.regions||[])];
    for (const a of all) {
      let latlngs = null;
      try {
        if (a.geometry?.type === "Polygon") latlngs = a.geometry.coordinates.map(ring => ring.map(c => [c[1], c[0]]));
        else if (a.coords) latlngs = a.coords.map(c => [c[1], c[0]]);
        else if (a.polygon) latlngs = a.polygon.map(c => [c[1], c[0]]);
      } catch (e) { continue; }
      if (!latlngs) continue;
      const name = String(a.name||"") + " " + String(a.key||"");
      const color = /київськ|киевск/.test(name.toLowerCase()) ? "#dc2626" : "#ea580c";
      try { L.polygon(latlngs, { color, weight: 1.5, opacity: .8, fillColor: color, fillOpacity: .12 }).addTo(alertLayer); } catch (e) {}
    }
  } catch (e) {}
}

/* ============ 21. UI ============ */
function initUI() {
  $("btnRefresh").addEventListener("click", () => { unlockAudio(); fetchMessages(); fetchThreats(); fetchAlerts(); showToast("Оновлення…"); });
  $("btnClear").addEventListener("click", () => {
    threatLayer.clearLayers(); msgLayer.clearLayers(); impactLayer.clearLayers(); coneLayer.clearLayers(); if (trailLayer) trailLayer.clearLayers();
    State.tracks.clear(); State.trails.clear(); State.msgMarkers.clear(); State.impactReports.clear();
    State.lastActive = null;
    updateBottomCard();
    showToast("Очищено");
  });
  $("btnQuickStatus").addEventListener("click", () => {
    let nearest = "—", nearestD = Infinity, dropping = 0;
    for (const c of State.trails.values()) {
      if (!c.points.length) continue;
      if (c._altDropping) dropping++;
      const last = c.points[c.points.length - 1];
      const d = distToKyiv(c._dLat != null ? c._dLat : last.lat, c._dLon != null ? c._dLon : last.lon);
      if (d < nearestD) {
        nearestD = d;
        nearest = `#${c._trackId} · ${last.name || "?"} · ${Math.round(d)} км`;
      }
    }
    for (const t of State.tracks.values()) {
      if (!t.threat) continue;
      const d = distToKyiv(t.threat.lat, t.threat.lon);
      if (d < nearestD) {
        nearestD = d;
        nearest = `API #${t.threat._trackId || t.id} · ${Math.round(d)} км`;
      }
    }
    const lines = [
      `📊 Треки: ${State.trails.size}`,
      `Загрози API: ${State.tracks.size}`,
      `Прильоти: ${State.impactReports.size}`,
      `Зниження: ${dropping}`,
      `Найближча: ${nearest}`,
      stratAviaOn ? "✈️ Стратег.авіація: ON" : "✈️ Стратег.авіація: OFF"
    ];
    showToast(lines.join(" · "), 4500);
  });
  $("btnScope").addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation(); unlockAudio();
    const isUA = $("btnScope").textContent === "🇺🇦";
    $("btnScope").textContent = isUA ? "🌍" : "🇺🇦";
    map.setView(isUA ? [50.45, 30.52] : [48.5, 31.0], isUA ? 6 : 6);
    showToast(isUA ? "🎯 Київ + 250 км" : "🇺🇦 Вся Україна");
  });
  $("topAlertClose").addEventListener("click", hideTopAlert);
  $("btnLang").addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    const b = $("btnLang");
    b.textContent = b.textContent === "UA" ? "EN" : "UA";
  });
  (function soundBtn() {
    const b = $("soundToggle");
    function update() { b.textContent = CFG.SOUND_ENABLED ? "🔔" : "🔕"; b.className = "sound-btn " + (CFG.SOUND_ENABLED ? "on" : "muted"); }
    update();
    b.addEventListener("click", e => {
      e.preventDefault(); e.stopPropagation(); unlockAudio();
      CFG.SOUND_ENABLED = !CFG.SOUND_ENABLED;
      update();
      showToast(CFG.SOUND_ENABLED ? "🔔 увімк" : "🔕 вимк");
    });
  })();
  $("sirenBtn").addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation(); unlockAudio();
    playBell(); playBell();
    showToast("🚨 Тест сирени");
  });
  $("btnRingsToggle").addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    ringsVisible = !ringsVisible;
    $("btnRingsToggle").classList.toggle("on", ringsVisible);
    drawRings();
    showToast(ringsVisible ? "🎯 Кільця ON" : "🎯 Кільця OFF");
  });
  (function mapBtn() {
    const b = $("btnMapToggle");
    const modes = ["sat", "osm", "omt"];
    let idx = 0;
    function apply() {
      if (map.hasLayer(baseSat)) map.removeLayer(baseSat);
      if (map.hasLayer(osmLayer)) map.removeLayer(osmLayer);
      if (map.hasLayer(omtLayer)) map.removeLayer(omtLayer);
      if (modes[idx] === "sat") baseSat.addTo(map);
      else if (modes[idx] === "osm") osmLayer.addTo(map);
      else omtLayer.addTo(map);
      b.textContent = { sat:"🛰", osm:"🗺", omt:"🌍" }[modes[idx]];
    }
    apply();
    b.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); idx = (idx+1)%3; apply(); });
  })();
  $("btnSettlements").addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); toggleSettlements(); });
  $("btnInfra").addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); toggleInfra(); });
  $("btnPower").addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); togglePower(); });
  $("btnStratAvia").addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation(); unlockAudio();
    stratAviaOn = !stratAviaOn;
    $("btnStratAvia").classList.toggle("on", stratAviaOn);
    showToast(stratAviaOn ? "✈️ Стратегічна авіація ON — сповіщення увімкнено" : "✈️ Стратегічна авіація OFF");
  });
  $("btnConfirmFilter").addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    cycleConfirmFilter();
  });
  $("btnApiToggle").addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    apiVisible = !apiVisible;
    applyApiVisibility();
    updateBottomCard();
    showToast(apiVisible ? "📡 API-треки УВІМК (можуть не бути БПЛА)" : "📡 API-треки ВИМК — лише канали", 2800);
  });
  (function geoBtn() {
    const b = $("btnGeo");
    let watchId = null, marker = null;
    function onPos(pos) {
      const lat = pos.coords.latitude, lon = pos.coords.longitude;
      if (!marker) {
        marker = L.marker([lat, lon], { icon: L.divIcon({ className:"", html:'<div class="user-loc-marker"><div class="user-loc-dot"></div></div>', iconSize:[22,22], iconAnchor:[11,11] }), zIndexOffset: 3000 }).addTo(map);
      } else marker.setLatLng([lat, lon]);
    }
    b.addEventListener("click", e => {
      e.preventDefault(); e.stopPropagation(); unlockAudio();
      if (watchId) {
        navigator.geolocation.clearWatch(watchId); watchId = null;
        if (marker) { map.removeLayer(marker); marker = null; }
        b.classList.remove("on"); showToast("🧭 Вимкнено");
      } else {
        watchId = navigator.geolocation.watchPosition(onPos, () => {}, { enableHighAccuracy: true });
        b.classList.add("on"); showToast("🧭 Увімкнено");
      }
    });
  })();
  $("btnVisual").addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    const b = $("btnVisual");
    b.classList.toggle("on");
    const showCard = b.classList.contains("on");
    document.body.classList.toggle("card-on", showCard);
    $("bottomCard").classList.toggle("show", showCard);
    if (showCard) updateBottomCard();
    showToast(showCard ? "👁 Панель ON" : "👁 Панель OFF");
  });
  $("btnFullscreen").addEventListener("click", e => {
    e.preventDefault(); e.stopPropagation();
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.().catch(()=>{});
  });
  $("btnMarkers").addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); showToast("📍 Клікніть на карту, щоб додати мітку"); });
  document.addEventListener("click", e => {
    const btn = e.target.closest(".popup-remove-btn");
    if (!btn) return;
    e.preventDefault(); e.stopPropagation();
    const kind = btn.getAttribute("data-remove"), key = btn.getAttribute("data-key");
    if (!kind || !key) return;
    if (kind === "track") {
      const tr = State.tracks.get(key);
      if (tr && tr.marker) threatLayer.removeLayer(tr.marker);
      State.tracks.delete(key);
    } else if (kind === "msg") {
      const chain = State.trails.get(key);
      if (chain && chain.marker) msgLayer.removeLayer(chain.marker);
      State.trails.delete(key);
    } else if (kind === "impact") {
      const r = State.impactReports.get(key);
      if (r && r.marker) impactLayer.removeLayer(r.marker);
      State.impactReports.delete(key);
    }
    map.closePopup();
    updateBottomCard();
  });
}
function initSearch() {
  const input = $("searchInput"), btn = $("searchBtn"), results = $("searchResults");
  btn.addEventListener("click", async () => {
    const q = input.value.trim();
    if (q.length < 2) return;
    try {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=8&countrycodes=ua&accept-language=uk`;
      const data = await (await fetch(url)).json();
      results.innerHTML = (data||[]).map((d,i) => `<div class="search-item" data-i="${i}"><div class="name">${esc(d.display_name.split(",")[0])}</div><div class="addr">${esc(d.display_name)}</div></div>`).join("");
      results.classList.add("show");
      results.querySelectorAll(".search-item").forEach(el => el.addEventListener("click", () => {
        const it = data[+el.dataset.i];
        if (it) { map.setView([+it.lat, +it.lon], 14); results.classList.remove("show"); }
      }));
    } catch (e) { showToast("Помилка пошуку"); }
  });
}

/* ============ 22. INIT ============ */
async function init() {
  try {
    initMap();
    initUI();
    initSearch();
    updateBottomCard();
    await fetchMessages();
    await fetchThreats();
    await fetchAlerts();
    setInterval(fetchMessages, CFG.POLL_MS);
    setInterval(fetchThreats, 15000);
    setInterval(fetchAlerts, 60000);
    // Плавний рух іконок + оновлення нижньої картки (найближча до Києва)
    setInterval(tickVisuals, MOVE_TICK_MS);
    setTimeout(unlockAudio, 500);
    console.log("[radar] ready v19.0 — jet course-change trail merge + Kyiv places");
  } catch (e) {
    Log.err("init: " + (e.message || e));
  }
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
</script>
